name: CPU AI Image Benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-image-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      OMP_NUM_THREADS: 4
      OPENBLAS_NUM_THREADS: 4
      MKL_NUM_THREADS: 4
      NUMEXPR_NUM_THREADS: 4

    steps:

      # ============================================================
      # 1. CHECK RUNNER
      # ============================================================
      - name: Check runner
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "CPU IMAGE GENERATION BENCHMARK"
          echo "=============================================="

          echo
          echo "=== CPU ==="
          lscpu || true

          echo
          echo "=== MEMORY ==="
          free -h

          echo
          echo "=== DISK ==="
          df -h /

          echo
          echo "=== OS ==="
          cat /etc/os-release

          echo
          echo "=============================================="

      # ============================================================
      # 2. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 3. INSTALL DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            wget \
            curl \
            pkg-config \
            libopenblas-dev \
            libwebp-dev \
            libwebp-dev \
            libavif-dev \
            python3 \
            python3-pip \
            imagemagick

          echo
          echo "=== TOOL VERSIONS ==="

          gcc --version | head -n 1
          g++ --version | head -n 1
          cmake --version | head -n 1
          git --version
          python3 --version

      # ============================================================
      # 4. CLONE STABLE-DIFFUSION.CPP
      # ============================================================
      - name: Clone stable-diffusion.cpp
        shell: bash
        run: |
          set -euo pipefail

          rm -rf stable-diffusion.cpp

          git clone \
            --recursive \
            --depth 1 \
            https://github.com/leejet/stable-diffusion.cpp.git \
            stable-diffusion.cpp

          cd stable-diffusion.cpp

          echo
          echo "=== COMMIT ==="
          git rev-parse HEAD

          echo
          echo "=== SUBMODULES ==="
          git submodule status || true

      # ============================================================
      # 5. CONFIGURE CPU BUILD
      # ============================================================
      - name: Configure CPU build
        shell: bash
        run: |
          set -euo pipefail

          cd stable-diffusion.cpp

          rm -rf build

          mkdir build
          cd build

          echo "Configuring CPU + OpenBLAS build..."

          cmake .. \
            -DGGML_OPENBLAS=ON \
            -DCMAKE_BUILD_TYPE=Release

      # ============================================================
      # 6. BUILD
      # ============================================================
      - name: Build CPU engine
        shell: bash
        run: |
          set -euo pipefail

          cd stable-diffusion.cpp

          echo
          echo "=============================================="
          echo "BUILDING STABLE-DIFFUSION.CPP"
          echo "=============================================="

          cmake \
            --build build \
            --config Release \
            --parallel 4

          echo
          echo "=== SEARCHING FOR EXECUTABLES ==="

          find build \
            -type f \
            -perm -111 \
            -name "sd-cli" \
            -print

          echo
          echo "=== BUILD DIRECTORY ==="

          find build/bin \
            -maxdepth 2 \
            -type f \
            -print \
            2>/dev/null || true

      # ============================================================
      # 7. LOCATE SD-CLI
      # ============================================================
      - name: Locate sd-cli
        shell: bash
        run: |
          set -euo pipefail

          SD_CLI="$(find stable-diffusion.cpp/build \
            -type f \
            -name "sd-cli" \
            -perm -111 \
            -print -quit)"

          if [ -z "$SD_CLI" ]; then
            echo
            echo "ERROR: sd-cli was not produced."
            echo
            echo "Build directory:"
            find stable-diffusion.cpp/build \
              -maxdepth 4 \
              -type f \
              -print \
              || true

            exit 1
          fi

          echo "SD_CLI=$SD_CLI" >> "$GITHUB_ENV"

          echo
          echo "Found:"
          echo "$SD_CLI"

          echo
          echo "=== HELP TEST ==="

          "$SD_CLI" --help | head -n 80

      # ============================================================
      # 8. PREPARE DIRECTORIES
      # ============================================================
      - name: Prepare directories
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p models
          mkdir -p output
          mkdir -p benchmark

      # ============================================================
      # 9. DOWNLOAD SD 1.5
      # ============================================================
      - name: Download Stable Diffusion 1.5
        shell: bash
        run: |
          set -euo pipefail

          MODEL="models/sd15.safetensors"

          if [ -s "$MODEL" ]; then
            echo "Model already exists."
          else
            echo "Downloading Stable Diffusion 1.5..."

            wget \
              --continue \
              --tries=5 \
              --timeout=60 \
              --progress=dot:giga \
              -O "$MODEL" \
              "https://huggingface.co/stable-diffusion-v1-5/stable-diffusion-v1-5/resolve/main/v1-5-pruned-emaonly.safetensors?download=true"
          fi

          echo
          echo "=== MODEL ==="
          ls -lh "$MODEL"

          test -s "$MODEL"

      # ============================================================
      # 10. GENERATE TEST IMAGE 1
      # ============================================================
      - name: Generate test image 1
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output benchmark

          START="$(date +%s)"

          "$SD_CLI" \
            -m models/sd15.safetensors \
            -p "premium cinematic hand-drawn 2D cartoon feature-animation frame, a young adult man urgently unlocking an old apartment door with a metal key, the key visibly entering and turning inside the lock, close three-quarter camera angle focused on the hands, key and lock, worried expression partially visible, detailed apartment hallway, dramatic warm evening light, painterly digital color, clean confident ink outlines, restrained cel shading, believable perspective, strong foreground midground background depth, polished storytelling composition, no text, no watermark, no posed portrait, the unlocking action is the dominant visual event" \
            -W 512 \
            -H 512 \
            --steps 12 \
            --sampling-method euler \
            --cfg-scale 7 \
            -s 1101 \
            -t 4 \
            --backend cpu \
            -o output/scene_01_event.png

          END="$(date +%s)"

          echo "$((END - START))" \
            > benchmark/scene_01.seconds

          test -s output/scene_01_event.png

      # ============================================================
      # 11. GENERATE TEST IMAGE 2
      # ============================================================
      - name: Generate test image 2
        shell: bash
        run: |
          set -euo pipefail

          START="$(date +%s)"

          "$SD_CLI" \
            -m models/sd15.safetensors \
            -p "premium cinematic hand-drawn 2D cartoon feature-animation frame, an elderly shopkeeper dropping a stack of cardboard boxes as a small frightened child reaches toward a fallen object on the floor, the falling boxes and reaching hands are the dominant action, low camera beside the boxes, busy neighborhood shop interior, expressive body language, warm practical lighting, painterly digital color, clean dark ink outlines, restrained cel shading, believable perspective, strong foreground midground background depth, detailed environment, no text, no watermark, do not center a protagonist portrait, no static standing pose" \
            -W 512 \
            -H 512 \
            --steps 12 \
            --sampling-method euler \
            --cfg-scale 7 \
            -s 2202 \
            -t 4 \
            --backend cpu \
            -o output/scene_02_action.png

          END="$(date +%s)"

          echo "$((END - START))" \
            > benchmark/scene_02.seconds

          test -s output/scene_02_action.png

      # ============================================================
      # 12. GENERATE TEST IMAGE 3
      # ============================================================
      - name: Generate test image 3
        shell: bash
        run: |
          set -euo pipefail

          START="$(date +%s)"

          "$SD_CLI" \
            -m models/sd15.safetensors \
            -p "premium cinematic hand-drawn 2D cartoon feature-animation frame, a red bicycle suddenly rolling downhill by itself after its kickstand has fallen away, an adult man running after it in the background but not dominating the frame, the moving bicycle is the primary visual subject, dynamic low tracking-camera composition, residential street, scattered leaves moving through the air, late afternoon sunlight, cinematic motion feeling, painterly digital color, clean confident ink outlines, restrained cel shading, believable perspective, detailed environment, no text, no watermark, no static standing pose" \
            -W 512 \
            -H 512 \
            --steps 12 \
            --sampling-method euler \
            --cfg-scale 7 \
            -s 3303 \
            -t 4 \
            --backend cpu \
            -o output/scene_03_object.png

          END="$(date +%s)"

          echo "$((END - START))" \
            > benchmark/scene_03.seconds

          test -s output/scene_03_object.png

      # ============================================================
      # 13. BENCHMARK REPORT
      # ============================================================
      - name: Create benchmark report
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "CPU AI IMAGE BENCHMARK"
            echo "====================="
            echo
            echo "Date:"
            date
            echo
            echo "CPU:"
            lscpu | grep -E \
              'Model name|CPU\(s\)|Core|Thread|Socket|Architecture' \
              || true
            echo
            echo "Memory:"
            free -h
            echo
            echo "Generation times:"
            echo
          } > benchmark/report.txt

          TOTAL=0
          COUNT=0

          for FILE in benchmark/*.seconds; do
            [ -f "$FILE" ] || continue

            NAME="$(basename "$FILE" .seconds)"
            SECONDS="$(cat "$FILE")"

            echo "$NAME = ${SECONDS}s" \
              | tee -a benchmark/report.txt

            TOTAL=$((TOTAL + SECONDS))
            COUNT=$((COUNT + 1))
          done

          echo >> benchmark/report.txt

          if [ "$COUNT" -gt 0 ]; then
            AVG=$((TOTAL / COUNT))

            echo "Total: ${TOTAL}s" \
              | tee -a benchmark/report.txt

            echo "Average: ${AVG}s/image" \
              | tee -a benchmark/report.txt
          fi

          echo
          cat benchmark/report.txt

      # ============================================================
      # 14. CREATE CONTACT SHEET
      # ============================================================
      - name: Create contact sheet
        shell: bash
        run: |
          set -euo pipefail

          montage \
            output/scene_01_event.png \
            output/scene_02_action.png \
            output/scene_03_object.png \
            -thumbnail 512x512 \
            -tile 3x1 \
            -geometry +10+10 \
            output/contact_sheet.jpg

          test -s output/contact_sheet.jpg

      # ============================================================
      # 15. FINAL VALIDATION
      # ============================================================
      - name: Validate results
        shell: bash
        run: |
          set -euo pipefail

          echo "=== OUTPUT ==="

          ls -lh output

          echo
          echo "=== BENCHMARK ==="

          cat benchmark/report.txt

          test -s output/scene_01_event.png
          test -s output/scene_02_action.png
          test -s output/scene_03_object.png
          test -s output/contact_sheet.jpg
          test -s benchmark/report.txt

      # ============================================================
      # 16. UPLOAD RESULTS
      # ============================================================
      - name: Upload benchmark
        uses: actions/upload-artifact@v4
        with:
          name: cpu-ai-image-benchmark
          path: |
            output/
            benchmark/
          retention-days: 7
